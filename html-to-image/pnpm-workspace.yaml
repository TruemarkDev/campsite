# Standalone project (not part of the root pnpm workspace).
# pnpm 11 errors on un-acknowledged dependency build scripts. puppeteer's
# postinstall downloads Chromium, which we intentionally skip (the image uses
# system google-chrome-stable and sets PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true).
# Declining the build (false) records that decision and satisfies the check.
allowBuilds:
  puppeteer: false
