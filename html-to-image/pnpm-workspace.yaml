overrides:
  # chromium-bidi still declares Zod 3. Its generated schemas are compatible
  # with Zod 4; the one error-reporting API difference is patched below. Keep
  # every Campsite lockfile on the same Zod major.
  'chromium-bidi>zod': 4.4.3

allowBuilds:
  puppeteer: true

patchedDependencies:
  chromium-bidi@0.6.3: patches/chromium-bidi@0.6.3.patch
