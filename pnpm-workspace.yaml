packages:
  - apps/*
  - packages/*

# Migrated from package.json "pnpm" field (pnpm 10+ reads these here, not there).
overrides:
  # Pin exactly: a range here resolves to multiple copies (18.2.74 + 18.3.31),
  # which breaks cross-package type inference ("cannot be named without a
  # reference to .pnpm/@types+react@...").
  '@types/react': 18.3.31
  # Both packages use Zod's public schema APIs that remain compatible in v4,
  # but their published manifests still pin Zod 3. Keep the workspace on one
  # Zod major without pulling in Sanity's unrelated Next/React major upgrades.
  '@sanity/codegen>zod': 4.4.3
  '@team-plain/typescript-sdk>zod': 4.4.3
  'form-data@>=4.0.0 <4.0.4': 4.0.4
  re2: 1.26.1
  'tar@>=7.0.0 <7.5.19': 7.5.19
  # Temporary: newest releases are younger than the minimumReleaseAge supply-chain
  # policy allows. Remove once the pins age out.
  'terser@>5.49.2': 5.49.2
  'electron-to-chromium@>1.5.403': 1.5.403
# pnpm 11 errors on un-acknowledged dependency build scripts. Each entry is an
# explicit decision: true = run the build (native binaries), false = skip it
# (funding/no-op postinstalls). Derived from the lockfile — confirm against
# pnpm's "Ignored build scripts" output on the next CI `pnpm install` and add
# any packages it still reports.
allowBuilds:
  esbuild: true
  '@sentry/cli': true
  sharp: true
  re2: true
  fsevents: true
  '@vercel/speed-insights': false
  core-js: false
  core-js-pure: false

