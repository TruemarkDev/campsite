packages:
  - apps/*
  - packages/*

# Migrated from package.json "pnpm" field (pnpm 10+ reads these here, not there).
overrides:
  # Pin exactly: a range here resolves to multiple copies (18.2.74 + 18.3.31),
  # which breaks cross-package type inference ("cannot be named without a
  # reference to .pnpm/@types+react@...").
  '@types/react': 19.2.18
  # Emotion 11.10's JSX types are not compatible with React 19's ReactNode.
  '@emotion/react': 11.14.0
  # Uses Zod public schema APIs that remain compatible in v4, but its published
  # manifest still pins Zod 3. (@sanity/codegen deliberately keeps its own Zod 3:
  # it calls ZodError.errors, which v4 removed.)
  '@team-plain/typescript-sdk>zod': 4.4.3
  # Hocuspocus 4.6.0 embeds Tiptap 3.29.2. Pin every package in the editor graph
  # because later ranges can resolve the incomplete 3.30.2 release.
  '@tiptap/core': 3.30.1
  '@tiptap/extension-blockquote': 3.30.1
  '@tiptap/extension-bold': 3.30.1
  '@tiptap/extension-bubble-menu': 3.30.1
  '@tiptap/extension-bullet-list': 3.30.1
  '@tiptap/extension-code': 3.30.1
  '@tiptap/extension-code-block': 3.30.1
  '@tiptap/extension-collaboration': 3.30.1
  '@tiptap/extension-collaboration-caret': 3.30.1
  '@tiptap/extension-details': 3.30.1
  '@tiptap/extension-document': 3.30.1
  '@tiptap/extension-dropcursor': 3.30.1
  '@tiptap/extension-floating-menu': 3.30.1
  '@tiptap/extension-gapcursor': 3.30.1
  '@tiptap/extension-hard-break': 3.30.1
  '@tiptap/extension-heading': 3.30.1
  '@tiptap/extension-history': 3.30.1
  '@tiptap/extension-horizontal-rule': 3.30.1
  '@tiptap/extension-italic': 3.30.1
  '@tiptap/extension-link': 3.30.1
  '@tiptap/extension-list': 3.30.1
  '@tiptap/extension-list-item': 3.30.1
  '@tiptap/extension-list-keymap': 3.30.1
  '@tiptap/extension-ordered-list': 3.30.1
  '@tiptap/extension-paragraph': 3.30.1
  '@tiptap/extension-placeholder': 3.30.1
  '@tiptap/extension-strike': 3.30.1
