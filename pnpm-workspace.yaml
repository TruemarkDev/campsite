  '@tiptap/extension-text': 3.30.1
  '@tiptap/extension-text-style': 3.30.1
  '@tiptap/extension-typography': 3.30.1
  '@tiptap/extension-underline': 3.30.1
  '@tiptap/extensions': 3.30.1
  '@tiptap/html': 3.30.1
  '@tiptap/pm': 3.30.1
  '@tiptap/react': 3.30.1
  '@tiptap/starter-kit': 3.30.1
  # Turbopack's server dependency tracer cannot follow the re-exported
  # node:crypto SubtleCrypto binding in 2.2.0. Use the upstream patch release
  # that exports the Node crypto bindings explicitly.
  universal-github-app-jwt: 2.2.2
  'form-data@>=4.0.0 <4.0.4': 4.0.4
  re2: 1.26.1
  'tar@>=7.0.0 <7.5.19': 7.5.19
  # Temporary: newest releases are younger than the minimumReleaseAge supply-chain
  # policy allows. Remove once the pins age out.
  'terser@>5.49.2': 5.49.2
  'electron-to-chromium@>1.5.403': 1.5.403
# pnpm 11 errors on un-acknowledged dependency build scripts. Each entry is an
# explicit decision: true = run the build (native binaries), false = skip it
# (funding/no-op postinstalls). Derived from the lockfile — confirm against
# pnpm's "Ignored build scripts" output on the next CI `pnpm install` and add
# any packages it still reports.
allowBuilds:
  esbuild: true
  '@sentry/cli': true
  sharp: true
  re2: true
  fsevents: true
  '@vercel/speed-insights': false
  core-js: false
  core-js-pure: false
  # native watcher used by @tailwindcss/cli --watch; same posture as fsevents
  '@parcel/watcher': true

