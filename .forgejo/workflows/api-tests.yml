name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Declared in stacks/forgejo-runner/runner-config.yml in the homelab repo.
    # Unlike the existing node-* labels this one must resolve to a Ruby image:
    # the API needs Ruby 4.0.6, and building a toolchain per run on a
    # capacity-1 runner would dominate the job. Node is installed below
    # because that image carries only Ruby.
    runs-on: campsite-ruby40
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: campsite-test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      # Carried over from the GitHub workflow. Nothing in the suite has been
      # shown to need it (test caching is :memory_store, Rack::Attack is off
      # outside production, and Sidekiq runs in :fake mode), so this is a
      # candidate for removal once a green run confirms it is unused.
      redis:
        image: redis@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      RAILS_ENV: test
      DB_ADAPTER: postgresql
      PG_TEST_HOST: postgres
      PG_TEST_PORT: '5432'
      PG_TEST_USER: postgres
      PG_TEST_PASSWORD: campsite-test
      # test_helper parallelizes with :number_of_processors. On this shared,
      # capacity-1 runner that spawns a full Rails process per core alongside
      # PostgreSQL and Redis, and the box thrashes — the first run
      # was still in the suite at 25 minutes with the host's own sshd timing
      # out. Cap the workers so the suite is memory-bound by choice.
      PARALLEL_WORKERS: '2'
      # Service containers resolve by service name, never 127.0.0.1.

    steps:
      # Must precede the checkout: git.home serves a certificate from Caddy's
      # internal CA, which no public image trusts, so actions/checkout cannot
      # clone over HTTPS without it. This is the same root forge carries at
      # /usr/local/share/ca-certificates/caddy-home.crt (valid to 2036-07-01) —
      # it is a public certificate, not a secret. Re-copy it here if the Caddy
      # CA is ever rotated (see ansible/trust_forgejo_registry_ca.yml).
      - name: Trust the homelab certificate authority
        run: |
          set -euo pipefail
          install -d /usr/local/share/ca-certificates
          cat > /usr/local/share/ca-certificates/caddy-home.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIBozCCAUqgAwIBAgIRAOF2Ev87LWhNZmE59B8vZG0wCgYIKoZIzj0EAwIwMDEu
          MCwGA1UEAxMlQ2FkZHkgTG9jYWwgQXV0aG9yaXR5IC0gMjAyNiBFQ0MgUm9vdDAe
          Fw0yNjA4MjMxMzI5MDNaFw0zNjA3MDExMzI5MDNaMDAxLjAsBgNVBAMTJUNhZGR5
          IExvY2FsIEF1dGhvcml0eSAtIDIwMjYgRUNDIFJvb3QwWTATBgcqhkjOPQIBBggq
          hkjOPQMBBwNCAARfSePicKBkWIPAUU1v14KbqIx+cyqPBr5dCvBUP+2dPpru2V+y
          fzU7XGyMds3/TnRCSyIrOvOWCLA1J5XDsuUUo0UwQzAOBgNVHQ8BAf8EBAMCAQYw
          EgYDVR0TAQH/BAgwBgEB/wIBATAdBgNVHQ4EFgQU1RRhYAdlV3/nH7FjvOvKWs6S
          EpEwCgYIKoZIzj0EAwIDRwAwRAIgXHoBqPxbEwKSvW1XdEiHhebTiZXn/tyGe1k2
          vEBRUUACICxNWQzbpomVum19Q94mK+S1HCP05HGTwFbSlhlROkH9
          -----END CERTIFICATE-----
          CERT
          sed -i 's/^          //' /usr/local/share/ca-certificates/caddy-home.crt
          # The runner bind-mounts the system bundle; update-ca-certificates
          # cannot atomically replace it. Use a job-owned bundle instead.
          cat /etc/ssl/certs/ca-certificates.crt /usr/local/share/ca-certificates/caddy-home.crt > /tmp/campsite-ca-bundle.crt
          openssl verify -CAfile /tmp/campsite-ca-bundle.crt /usr/local/share/ca-certificates/caddy-home.crt
          {
            echo "SSL_CERT_FILE=/tmp/campsite-ca-bundle.crt"
            echo "CURL_CA_BUNDLE=/tmp/campsite-ca-bundle.crt"
            echo "GIT_SSL_CAINFO=/tmp/campsite-ca-bundle.crt"
            echo "NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/caddy-home.crt"
          } >> "$GITHUB_ENV"

      # node must exist before any JavaScript action runs (actions/checkout is
      # one); the Ruby image the campsite-ruby40 label resolves to ships none.
      - name: Install system packages the gems and asset build need
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libpq-dev pkg-config git curl ffmpeg xz-utils python3 zip unzip
          # The official pinned binary avoids NodeSource's certificate-package
          # postinstall rewriting the runner's bind-mounted system CA bundle.
          node_archive=node-v24.19.0-linux-x64.tar.xz
          curl --fail --silent --show-error --retry 3 "https://nodejs.org/dist/v24.19.0/$node_archive" -o "/tmp/$node_archive"
          curl --fail --silent --show-error --retry 3 https://nodejs.org/dist/v24.19.0/SHASUMS256.txt -o /tmp/node-shasums.txt
          cd /tmp
          grep -F " $node_archive" node-shasums.txt | sha256sum --check --strict
          tar -xJf "$node_archive" -C /usr/local --strip-components=1
          test "$(node --version)" = v24.19.0
          npm install --global pnpm@11.9.0

      - name: Check out the committed source
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install gems
        working-directory: api
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Install the API's asset dependencies
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Install API generation dependencies
        run: pnpm install --frozen-lockfile --filter @campsite/monorepo --filter '@campsite/types...'

      - name: Audit Ruby dependencies
        working-directory: api
        run: bundle exec bundler-audit check --update

      - name: Scan Rails security
        working-directory: api
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error --ensure-ignore-notes --ensure-no-obsolete-ignore-entries

      # Verify only. The GitHub workflow autocorrected and pushed the fixes back
      # to the branch using a GitHub App token; Forgejo has no equivalent, so
      # this fails the build instead of rewriting the contributor's commit.
      - name: Lint
        working-directory: api
        run: bundle exec rubocop --parallel

      - name: Load the schema
        working-directory: api
        run: bundle exec rails db:create db:schema:load

      - name: Verify API generation contracts
        run: |
          node --test script/test-environment.test.mjs
          python3 -B -m unittest discover -s script/tests -p 'test_postgresql_metrics.py'
          node --test script/swagger-templates/*.test.mjs
          script/gen-client --check
          pnpm -F @campsite/types exec tsc --noEmit --declaration false --declarationMap false

      - name: Precompile assets
        working-directory: api
        run: bundle exec rails assets:precompile

      - name: Run tests
        working-directory: api
        run: bundle exec rails test
