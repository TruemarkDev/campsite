service: campsite-api-tokdio
image: truemarkdev/campsite-api
secrets_path: .kamal/campsite-secrets
deploy_timeout: 90

servers:
  web:
    - 192.168.10.7

proxy:
  ssl: false
  hosts:
    - camp-api.tokdio.com
    - camp-auth.tokdio.com
    - camp-admin.tokdio.com
    - camp-cdn.tokdio.com
    - api.camp.home
    - auth.camp.home
    - admin.camp.home
    - cdn.camp.home
  app_port: 8080
  healthcheck:
    path: /up
    interval: 10

registry:
  server: localhost:5555

builder:
  arch: amd64
  remote: ssh://prakash@builder.home
  context: api
  dockerfile: api/Dockerfile
  args:
    BUNDLER_VERSION: "4.0.15"
    RUBY_VERSION: "4.0.6"

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    PORT: "8080"
    SESSION_COOKIE_SECURE: "false"
    APP_URL: http://camp.home
    MARKETING_SITE_URL: http://camp.home
    STYLED_TEXT_API_URL: http://styled-text.camp.home
    HTML_TO_IMAGE_URL: http://html-to-image.camp.home
    MEDIA_PROVIDER: cloudflare
    MEDIA_CDN_URL: http://cdn.camp.home
    API_SUBDOMAIN: api
    AUTH_SUBDOMAIN: auth
    AUTH_SUBDOMAINS: auth,camp-auth
    ADMIN_SUBDOMAIN: admin
    ADMIN_SUBDOMAINS: admin,camp-admin
    MAILER_HOST: auth.camp.home
    MAILER_PROTOCOL: http
    MAILER_FROM: Campsite <campsite@agents.home>
    SMTP_ADDRESS: smtp.home
    SMTP_PORT: "25"
    SMTP_DOMAIN: agents.home
    SMTP_AUTHENTICATION: none
    SMTP_STARTTLS: "false"
    SMTP_OPEN_TIMEOUT: "15"
    SMTP_READ_TIMEOUT: "25"
    ALLOWED_HOSTS: api.camp.home,auth.camp.home,admin.camp.home,cdn.camp.home,camp-api.tokdio.com,camp-auth.tokdio.com,camp-admin.tokdio.com,camp-cdn.tokdio.com
    REDIS_URL: redis://campsite-api-tokdio-redis:6379/0
    REDIS_SIDEKIQ_URL: redis://campsite-api-tokdio-redis:6379/1
    RACK_ATTACK_REDIS_URL: redis://campsite-api-tokdio-redis:6379/2
    SIDEKIQ_SCHEDULER_ENABLED: "false"
    S3_REGION: us-east-1
    S3_ENDPOINT: http://s3.camp.home
    S3_BUCKET: campsite-media
    S3_FORCE_PATH_STYLE: "true"
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - DATABASE_REPLICA_URL
    - ELASTICSEARCH_URL
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY

accessories:
  mysql:
    service: campsite-api-tokdio-mysql
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    host: 192.168.10.7
    env:
      clear:
        MYSQL_DATABASE: campsite_production
        MYSQL_USER: campsite
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_PASSWORD
    volumes:
      - campsite-api-tokdio_mysql-data:/var/lib/mysql
    options:
      restart: unless-stopped
      memory: 1g
      health-cmd: mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD
      health-interval: 10s
      health-timeout: 5s
      health-retries: 20
      health-start-period: 30s

  redis:
    service: campsite-api-tokdio-redis
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    host: 192.168.10.7
    cmd: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - campsite-api-tokdio_redis-data:/data
    options:
      restart: unless-stopped
      memory: 384m
      health-cmd: redis-cli ping
      health-interval: 10s
      health-timeout: 5s
      health-retries: 12

  objects:
    service: campsite-api-tokdio-objects
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z@sha256:064117214caceaa8d8a90ef7caa58f2b2aeb316b5156afe9ee8da5b4d83e12c8
    host: 192.168.10.7
    cmd: server /data --console-address :9001
    env:
      secret:
        - MINIO_ROOT_USER
        - MINIO_ROOT_PASSWORD
    volumes:
      - campsite-api-tokdio_objects-data:/data
    options:
      restart: unless-stopped
      memory: 512m
      health-cmd: curl --fail --silent http://127.0.0.1:9000/minio/health/live
      health-interval: 10s
      health-timeout: 5s
      health-retries: 12

  elasticsearch:
    service: campsite-api-tokdio-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0@sha256:8818ab9af72d7482e38a9d6f0454d5ee667564a25bbdc42360c0f9b8f8f72fc5
    host: shuri@192.168.20.14
    port: "9201:9200"
    env:
      clear:
        cluster.name: campsite-tokdio
        node.name: campsite-tokdio-es01
        discovery.type: single-node
        xpack.security.enabled: "true"
        node.store.allow_mmap: "false"
        ingest.geoip.downloader.enabled: "false"
      secret:
        - ELASTIC_PASSWORD
    files:
      - config/elasticsearch/shadow-heap.options:/usr/share/elasticsearch/config/jvm.options.d/heap.options:ro
    volumes:
      - campsite-api-tokdio_elasticsearch-data:/usr/share/elasticsearch/data
    options:
      restart: unless-stopped
      memory: 2g
      ulimit: nofile=65535:65535
      health-cmd: curl --fail --silent -u elastic:$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health
      health-interval: 10s
      health-timeout: 5s
      health-retries: 12
      health-start-period: 30s

ssh:
  user: debian
