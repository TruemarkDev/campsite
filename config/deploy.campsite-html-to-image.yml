service: campsite-html-to-image-tokdio
image: truemarkdev/campsite-html-to-image
secrets_path: .kamal/campsite-secrets

servers:
  web:
    - 192.168.10.7

proxy:
  ssl: false
  hosts:
    - camp-html-to-image.tokdio.com
    - html-to-image.camp.home
  app_port: 9222
  healthcheck:
    path: /up
    interval: 10

registry:
  server: localhost:5555

builder:
  arch: amd64
  remote: ssh://prakash@builder.home
  context: html-to-image
  dockerfile: html-to-image/Dockerfile

env:
  clear:
    NODE_ENV: production
    PORT: "9222"

ssh:
  user: debian
