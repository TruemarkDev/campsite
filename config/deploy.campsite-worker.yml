# Sidekiq is intentionally isolated from the Rails web deployment. Do not
# deploy this service until writer custody has moved away from the legacy
# production worker and queue consumption has been explicitly authorized.
service: campsite-worker-tokdio
image: truemarkdev/campsite-worker
secrets_path: .kamal/campsite-secrets

primary_role: worker
servers:
  worker:
    hosts:
      - 192.168.10.7
    cmd: bundle exec sidekiq
    proxy: false

registry:
  server: localhost:5555

builder:
  arch: amd64
  remote: ssh://debian@192.168.10.7
  context: api
  dockerfile: api/Dockerfile
  args:
    BUNDLER_VERSION: "4.0.15"
    RUBY_VERSION: "4.0.6"

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    APP_URL: http://camp.home
    MARKETING_SITE_URL: http://camp.home
    STYLED_TEXT_API_URL: http://styled-text.camp.home
    HTML_TO_IMAGE_URL: http://html-to-image.camp.home
    API_SUBDOMAIN: api
    AUTH_SUBDOMAIN: auth
    AUTH_SUBDOMAINS: auth,camp-auth
    ADMIN_SUBDOMAIN: admin
    ADMIN_SUBDOMAINS: admin,camp-admin
    MAILER_HOST: auth.camp.home
    MAILER_PROTOCOL: http
    REDIS_URL: redis://campsite-api-tokdio-redis:6379/0
    REDIS_SIDEKIQ_URL: redis://campsite-api-tokdio-redis:6379/1
    RACK_ATTACK_REDIS_URL: redis://campsite-api-tokdio-redis:6379/2
    SIDEKIQ_SCHEDULER_ENABLED: "false"
    S3_REGION: us-east-1
    S3_ENDPOINT: http://campsite-api-tokdio-objects:9000
    S3_BUCKET: campsite-media
    S3_FORCE_PATH_STYLE: "true"
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - DATABASE_REPLICA_URL
    - ELASTICSEARCH_URL
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY

ssh:
  user: debian
