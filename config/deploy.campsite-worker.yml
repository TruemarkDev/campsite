# Sidekiq is intentionally isolated from the Rails web deployment. Writer
# custody belongs to this staging worker; keep the scheduler disabled unless
# its separate promotion step is explicitly authorized.
service: campsite-worker-staging
image: truemarkdev/campsite-worker
secrets_path: .kamal/campsite-secrets

primary_role: worker
servers:
  worker:
    hosts:
      - 192.168.10.7
    cmd: bundle exec sidekiq
    proxy: false
  export:
    hosts:
      - 192.168.10.7
    cmd: bundle exec sidekiq -C config/sidekiq_export.yml
    proxy: false

registry:
  server: localhost:5555

builder:
  arch: amd64
  remote: ssh://prakash@builder.home
  context: api
  dockerfile: api/Dockerfile
  args:
    BUNDLER_VERSION: "4.0.15"
    RUBY_VERSION: "4.0.6"

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    APP_URL: http://camp.home
    MARKETING_SITE_URL: http://camp.home
    STYLED_TEXT_API_URL: http://styled-text.camp.home
    HTML_TO_IMAGE_URL: http://html-to-image.camp.home
    SYNC_SERVER_URL: http://sync.camp.home
    MEDIA_PROVIDER: cloudflare
    MEDIA_CDN_URL: http://cdn.camp.home
    API_SUBDOMAIN: api
    AUTH_SUBDOMAIN: auth
    AUTH_SUBDOMAINS: auth,camp-auth
    ADMIN_SUBDOMAIN: admin
    ADMIN_SUBDOMAINS: admin,camp-admin
    MAILER_HOST: auth.camp.home
    MAILER_PROTOCOL: http
    MAILER_FROM: Campsite <campsite@agents.home>
    SMTP_ADDRESS: smtp.home
    SMTP_PORT: "25"
    SMTP_DOMAIN: agents.home
    SMTP_AUTHENTICATION: none
    SMTP_STARTTLS: "false"
    SMTP_OPEN_TIMEOUT: "15"
    SMTP_READ_TIMEOUT: "25"
    REDIS_URL: redis://campsite-api-staging-redis:6379/0
    REDIS_SIDEKIQ_URL: redis://campsite-api-staging-redis:6379/1
    RACK_ATTACK_REDIS_URL: redis://campsite-api-staging-redis:6379/2
    SIDEKIQ_SCHEDULER_ENABLED: "false"
    S3_REGION: us-east-1
    S3_ENDPOINT: http://s3.camp.home
    S3_BUCKET: campsite-media
    DATA_EXPORT_S3_BUCKET: campsite-exports
    S3_FORCE_PATH_STYLE: "true"
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - DATABASE_REPLICA_URL
    - ELASTICSEARCH_URL
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY

ssh:
  user: debian
