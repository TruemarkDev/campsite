# Unified shadow deployment across Odin and Shuri. Kamal deploys the
# HTML-to-image application on Odin and manages Elasticsearch on Shuri as a
# stateful accessory. This configuration does not change public DNS.
service: campsite-shadow-html-to-image
image: truemarkdev/campsite-shadow-html-to-image
secrets_path: .kamal/campsite-secrets

servers:
  web:
    - 192.168.10.7

proxy:
  ssl: false
  host: camp-html-to-image.shadow.tokdio.com
  app_port: 9222
  healthcheck:
    path: /up
    interval: 10

# Build, store, and run the amd64 image entirely on Odin. Application deploys
# are scoped to the web role so local-registry forwarding excludes accessories.
registry:
  server: localhost:5555

builder:
  arch: amd64
  remote: ssh://prakash@builder.home
  context: html-to-image
  dockerfile: html-to-image/Dockerfile

env:
  clear:
    NODE_ENV: production
    PORT: "9222"

accessories:
  elasticsearch:
    service: campsite-shadow-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0@sha256:8818ab9af72d7482e38a9d6f0454d5ee667564a25bbdc42360c0f9b8f8f72fc5
    host: shuri@192.168.20.14
    port: "127.0.0.1:9200:9200"
    env:
      clear:
        cluster.name: campsite-shadow
        node.name: campsite-shadow-es01
        discovery.type: single-node
        xpack.security.enabled: "false"
        node.store.allow_mmap: "false"
        ingest.geoip.downloader.enabled: "false"
    files:
      - config/elasticsearch/shadow-heap.options:/usr/share/elasticsearch/config/jvm.options.d/heap.options:ro
    volumes:
      - campsite-shadow_elasticsearch-data:/usr/share/elasticsearch/data
    options:
      restart: unless-stopped
      memory: 2g
      ulimit: nofile=65535:65535
      health-cmd: curl --fail --silent http://127.0.0.1:9200/_cluster/health
      health-interval: 10s
      health-timeout: 5s
      health-retries: 12
      health-start-period: 30s

ssh:
  user: debian
