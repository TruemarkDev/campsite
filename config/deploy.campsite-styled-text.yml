service: campsite-styled-text-staging
image: truemarkdev/campsite-styled-text
secrets_path: .kamal/campsite-secrets

servers:
  web:
    - 192.168.10.32

proxy:
  ssl: false
  hosts:
    - styled-text.camp.home
  app_port: 9000
  healthcheck:
    path: /up
    interval: 10

registry:
  server: builder.home:5555
  username: KAMAL_REGISTRY_USER_NAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://prakash@builder.home
  context: .
  dockerfile: apps/styled-text-server/Dockerfile

env:
  clear:
    NODE_ENV: production
    PORT: "9000"
  secret:
    - AUTHTOKEN

ssh:
  user: prakash
