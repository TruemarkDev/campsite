service: campsite-styled-text-server

image: truemarkdev/campsite
secrets_path: apps/styled-text-server/.env.local

servers:
  web:
    - 51.91.240.88

env:
  secret:
    - AUTHTOKEN
    - SENTRY_DSN

proxy:
  ssl: true
  hosts:
    - camp-styled-text.polo-apps.com
  app_port: 9000

registry:
  server: localhost:5555

builder:
  arch: amd64
  context: .
  dockerfile: apps/styled-text-server/Dockerfile
ssh:
  user: deploy
