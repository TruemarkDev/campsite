default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('DB_POOL') { [Integer(ENV.fetch('RAILS_MAX_THREADS', 5)), Integer(ENV.fetch('SIDEKIQ_CONCURRENCY', 5))].max + Integer(ENV.fetch('RAILS_MAX_ASYNC_QUERIES', 4)) + 1 } %>
  host: <%= ENV.fetch('PGHOST', '127.0.0.1') %>
  port: <%= ENV.fetch('PGPORT', 5432) %>
  username: <%= ENV.fetch('PGUSER', ENV.fetch('USER', 'postgres')) %>
  password: <%= ENV['PGPASSWORD'] %>
  schema_dump: schema.postgresql.rb

development:
  primary:
    <<: *default
    database: campsite_api_development

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("PG_TEST_DATABASE", "campsite_api_test_pg") %>
    host: <%= ENV.fetch('PG_TEST_HOST', '127.0.0.1') %>
    port: <%= ENV.fetch('PG_TEST_PORT', 5432) %>
    username: <%= ENV.fetch('PG_TEST_USER', ENV.fetch('USER', 'postgres')) %>
    password: <%= ENV['PG_TEST_PASSWORD'] %>

production:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
