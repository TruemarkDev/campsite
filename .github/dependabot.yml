version: 2
updates:
  # JavaScript monorepo. `npm` is Dependabot's label for the JS ecosystem; it
  # detects and updates the pnpm workspace via pnpm-lock.yaml (this repo uses
  # pnpm only — not npm or yarn). Dependency updates are scoped to JS only.
  - package-ecosystem: 'npm'
    directory: '/'
    versioning-strategy: increase
    schedule:
      interval: 'weekly'
      day: 'monday'
    allow:
      - dependency-name: '@sentry/*'
      - dependency-name: '@tanstack/*'
      - dependency-name: 'next'
      - dependency-name: 'eslint-config-next'
      - dependency-name: '@next/bundle-analyzer'
    # This option has no impact on security updates which have a separate internal limit of 10 PRs
    # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit
    open-pull-requests-limit: 2
    groups:
      # Batch all security-driven bumps into a single PR to keep review load low.
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      # Prefix all commit messages with "chore: "
      prefix: 'chore'
      include: 'scope'

  # Rails API gems. Routine version updates stay within the repository's
  # patch/minor stewardship policy; security updates are not restricted by
  # this allow rule.
  - package-ecosystem: 'bundler'
    directory: '/api'
    versioning-strategy: increase
    schedule:
      interval: 'weekly'
      day: 'monday'
    allow:
      - dependency-type: 'all'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
    open-pull-requests-limit: 2
    groups:
      bundler-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # Keep pinned workflow actions current independently from application gems.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
